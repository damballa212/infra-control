# E2E Playwright: lento, así que solo bajo demanda (manual o label «e2e» en el PR).
# Separado de ci.yml para que etiquetar un PR (p. ej. Dependabot) no cancele la CI normal.
name: E2E

on:
  pull_request:
    types: [labeled]
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'e2e'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - working-directory: design/handoff
        run: npm ci
      - working-directory: design/handoff
        run: npm run build
      - working-directory: design/handoff
        run: npx playwright install --with-deps chromium
      - working-directory: design/handoff
        run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-resultados
          path: design/handoff/test-results
          retention-days: 7
