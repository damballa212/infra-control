name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm audit --omit=dev
  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: design/handoff
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: design/handoff/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: .
      - run: npm run typecheck
      - run: npm test
      - run: npm run contract
  agents:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m unittest discover -s ops/pc/reporters -p 'test_*.py'
      - run: python3 -m unittest discover -s ops/vps -p 'test_*.py'
      - run: python3 -m unittest discover -s ops/hermes -p 'test_*.py'
